# True Co-op Fixes: builds NVCoop.dll (32-bit, Release) with Visual Studio on every push to main.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure (Win32)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build NVCoop.dll
        run: cmake --build build --config Release --target NVCoop
      - uses: actions/upload-artifact@v4
        with:
          name: NVCoop-${{ github.sha }}
          path: |
            build/Release/NVCoop.dll
            build/Release/NVCoop.map
